# AQJ OS Bootloader Configuration (Limine)
# https://github.com/limine-bootloader/limine

timeout: 5
default_entry: 1
graphics: yes

# Visual Customization
wallpaper: boot():/boot/limine/wallpaper.png
interface_branding: AQJ OS (Linux 7.1.8)

# Boot Entry 1: Standard Boot
/AQJ OS (Linux Kernel 7.1.8)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz-7.1.8
    initrd_path: boot():/boot/initramfs.img
    cmdline: quiet loglevel=3 rw root=/dev/ram0 console=tty1

# Boot Entry 2: Verbose / Safe Mode
/AQJ OS (Safe Mode / Verbose Logging)
    protocol: linux
    kernel_path: boot():/boot/vmlinuz-7.1.8
    initrd_path: boot():/boot/initramfs.img
    cmdline: debug verbose rw root=/dev/ram0 console=tty1
