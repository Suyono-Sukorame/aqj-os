# ==============================================================================
# dhcpcd.conf - AQJ OS DHCP Client Configuration
# ==============================================================================

# Timeout untuk menunggu lease DHCP (detik)
timeout 30

# Kirim hostname ke server DHCP
hostname

# Minta semua informasi dari server DHCP
option domain_name_servers, domain_name, domain_search
option ntp_servers
option interface_mtu

# Aktifkan update DNS di /etc/resolv.conf
nohook wpa_supplicant

# Konfigurasi spesifik interface kabel (eth0)
# Uncomment untuk mengatur IP statis:
# interface eth0
# static ip_address=192.168.1.100/24
# static routers=192.168.1.1
# static domain_name_servers=1.1.1.1 8.8.8.8

# Interface Wi-Fi (wlan0) dikelola oleh iwd, bukan dhcpcd
# noipv6 pada interface wlan0 jika iwd sudah handle
